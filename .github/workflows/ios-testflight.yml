# Builds the iPhone app on Expo's servers and sends it to TestFlight.
# Run it from the Actions tab ("iOS TestFlight" → Run workflow).
#
# Needs, under Settings → Secrets and variables → Actions:
#   secrets:   EXPO_TOKEN          (expo.dev → Account settings → Access tokens)
#              ASC_API_KEY_P8      (full text of the App Store Connect API key .p8 file)
#   variables: ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID, APPLE_TEAM_TYPE (INDIVIDUAL or COMPANY_OR_ORGANIZATION),
#              ASC_APP_ID (the app's Apple ID number in App Store Connect; leave unset to build without submitting)
#
# With the API key, Expo creates the distribution certificate and provisioning profile itself,
# so no Mac or Apple ID login is needed.

name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-api-key.p8
      EXPO_ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check setup
        run: |
          missing=""
          for v in EXPO_TOKEN EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "${{ secrets.ASC_API_KEY_P8 }}" ] || missing="$missing ASC_API_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: Write App Store Connect key
        run: |
          printf '%s\n' "${{ secrets.ASC_API_KEY_P8 }}" > "$EXPO_ASC_API_KEY_PATH"
          chmod 600 "$EXPO_ASC_API_KEY_PATH"

      - name: Submit settings
        if: env.ASC_APP_ID != ''
        run: |
          jq --arg app "$ASC_APP_ID" --arg kid "$EXPO_ASC_KEY_ID" --arg iss "$EXPO_ASC_ISSUER_ID" \
            '.submit.production.ios = {ascAppId: $app, ascApiKeyPath: "./asc-api-key.p8", ascApiKeyId: $kid, ascApiKeyIssuerId: $iss}' \
            eas.json > eas.tmp && mv eas.tmp eas.json

      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq expect

      # eas-cli only creates new iOS signing credentials in interactive mode, so it runs in a
      # pseudo-terminal. With the API key there is nothing to type; any question gets its default.
      - name: Build (and submit to TestFlight)
        run: |
          SUBMIT=""; [ -n "$ASC_APP_ID" ] && SUBMIT="--auto-submit"
          export SUBMIT
          expect <<'EOF'
          set timeout 4800
          spawn npx --yes eas-cli@latest build --platform ios --profile production {*}$env(SUBMIT)
          expect {
            -re {\? [^\n]*\(Y/n\)} { send "y\r"; exp_continue }
            -re {\? [^\n]*›} { send "\r"; exp_continue }
            timeout { puts "\nTimed out"; exit 1 }
            eof
          }
          lassign [wait] pid spawnid os_error value
          exit $value
          EOF

      - name: Remove key
        if: always()
        run: rm -f "$EXPO_ASC_API_KEY_PATH"
